name: LaneLine
options:
  bundleIdPrefix: com.laneline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4FSKF3KBAN
    # MusicKit requires the "MusicKit" app service to be enabled for this
    # bundle ID in the Apple Developer portal (Certificates, Identifiers &
    # Profiles > Identifiers > App Services). No entitlement file is needed.

targets:
  LaneLine:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Models
      - Services
      - Features
      - DesignSystem
      - PreviewContent
      # Shared with LaneLineWidgets: the Live Activity attributes/content
      # state type has to be visible to both the app (which starts/updates
      # the activity) and the widget extension (which renders it).
      - Shared
      # Copied as individual files, not a folder reference: a top-level
      # "Resources" directory inside an iOS bundle breaks CFBundle's flat
      # layout detection and the simulator rejects the install.
      - path: Resources
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: LaneLine
        CFBundleShortVersionString: "1.8.0"
        CFBundleVersion: "16"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppleMusicUsageDescription: >-
          LaneLine shows your Apple Music now playing info and ride playlists
          on the navigation screen so you can control music without leaving
          turn-by-turn guidance.
        NSLocationWhenInUseUsageDescription: >-
          LaneLine uses your location to plan bike routes from where you are
          and to guide you turn by turn while riding.
        NSMotionUsageDescription: >-
          LaneLine uses the barometer to measure climbing and descent
          accurately during rides.
        NSHealthUpdateUsageDescription: >-
          LaneLine saves completed rides to Health as cycling workouts —
          distance, duration, calories, and route.
        NSHealthShareUsageDescription: >-
          LaneLine reads your heart rate from Health during rides so your
          Apple Watch's live BPM shows on the ride screen and in the ride
          summary. Nothing else is read, and nothing leaves the device.
        UIBackgroundModes:
          - audio
          - location
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Support/LaneLine.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: LaneLineWidgets
        embed: true
    scheme:
      testTargets:
        - LaneLineTests

  LaneLineTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    sources:
      - Tests
    dependencies:
      - target: LaneLine

  # End-to-end ride flow over the bundled demo data (`-demoRide`), run via
  # the LaneLineUITests scheme so the unit-test loop stays fast:
  # xcodebuild test -scheme LaneLineUITests
  LaneLineUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: LaneLine
    sources:
      - UITests
    scheme:
      testTargets:
        - LaneLineUITests

  LaneLineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - LaneLineWidgets
    settings:
      base:
        # Extension bundle IDs must be the containing app's ID plus a
        # suffix — the default `{bundleIdPrefix}.{target}` pattern would
        # produce a sibling ID, not a contained one, which Xcode rejects
        # at embed time.
        PRODUCT_BUNDLE_IDENTIFIER: com.laneline.LaneLine.LaneLineWidgets
    info:
      path: LaneLineWidgets/Info.plist
      properties:
        CFBundleDisplayName: LaneLine
        # App Store validation requires the extension's version to match the
        # containing app's (see the app target's Info properties) — xcodegen
        # rewrites this plist on every generate, so the values live here.
        CFBundleShortVersionString: "1.8.0"
        CFBundleVersion: "16"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
